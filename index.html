<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Protokoll über Erstellung der Erdungsanlage</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --bg-color: #f8fafc;
    --card-bg: #ffffff;
    --text-color: #1e293b;
    --border-color: #cbd5e1;
    --danger: #ef4444;
    --success: #22c55e;
  }
  body {
    font-family: system-ui, -apple-system, sans-serif, Arial;
    background-color: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: 10px;
    line-height: 1.5;
  }
  .container {
    max-width: 600px;
    margin: 0 auto;
    background: var(--card-bg);
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
  }
  h1 {
    font-size: 1.3rem;
    text-align: center;
    color: var(--primary);
    margin-bottom: 20px;
  }
  fieldset {
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 15px;
    background: #fff;
  }
  legend {
    font-weight: bold;
    color: var(--primary);
    padding: 0 5px;
  }
  .form-group {
    margin-bottom: 12px;
  }
  .form-row {
    display: flex;
    gap: 10px;
  }
  .form-row .form-group {
    flex: 1;
  }
  label {
    display: block;
    font-weight: 600;
    font-size: 0.9rem;
    margin-bottom: 5px;
  }
  input[type="text"], input[type="date"], input[type="number"], select, textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    box-sizing: border-box;
    font-size: 1rem;
  }
  .checkbox-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 8px;
  }
  .checkbox-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: normal;
  }
  .checkbox-item input {
    width: 20px;
    height: 20px;
  }
  .custom-photo-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    background-color: #2c3e50;
    color: white;
    padding: 12px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 0.95rem;
    cursor: pointer;
    margin-top: 8px;
    text-align: center;
    box-sizing: border-box;
  }
  .custom-photo-btn input[type="file"] {
    display: none;
  }
  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 20px;
  }
  button {
    background-color: var(--primary);
    color: white;
    border: none;
    padding: 12px;
    border-radius: 6px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { opacity: 0.9; }
  button.btn-success { background-color: var(--success); }
  button.btn-secondary { background-color: #64748b; }
  button.btn-danger { background-color: var(--danger); }
  
  .photo-preview {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 10px;
    justify-content: center;
  }
  .photo-thumb {
    position: relative;
    width: 80px;
    height: 80px;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--border-color);
  }
  .photo-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .photo-thumb button.delete-photo {
    position: absolute;
    top: 2px;
    right: 2px;
    background: rgba(239, 68, 68, 0.85);
    color: white;
    border: none;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Protokoll über Erstellung der Erdungsanlage</h1>
  
  <form id="erdungsForm">
    
    <!-- 1. Stammdaten -->
    <fieldset>
      <legend>📋 Stammdaten</legend>
      <div class="form-group">
        <label for="datum">Datum</label>
        <input type="date" id="datum" required>
      </div>
      <div class="form-group">
        <label for="auftragsnummer">Auftragsnummer</label>
        <input type="text" id="auftragsnummer" placeholder="z.B. 2026-991">
      </div>
      <div class="form-group">
        <label for="monteur">Monteur</label>
        <input type="text" id="monteur" required placeholder="Name">
      </div>
      <div class="form-group">
        <label for="strasse">Straße & Hausnummer</label>
        <input type="text" id="strasse" required placeholder="Musterstraße 12">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="plz">PLZ</label>
          <input type="text" id="plz" required placeholder="69115">
        </div>
        <div class="form-group">
          <label for="stadt">Stadt</label>
          <input type="text" id="stadt" required placeholder="Heidelberg">
        </div>
      </div>
    </fieldset>

    <!-- 2. Erderprüfung -->
    <fieldset>
      <legend>Erderprüfung</legend>
      <div class="form-group">
        <label for="ohmWert">Gemessener Erdungswiderstand (&Omega;):</label>
        <input type="number" step="0.01" id="ohmWert" placeholder="z. B. 0.5">
      </div>
      <div class="form-group">
        <label for="erderTiefe">Tiefe des Tiefenerders (m):</label>
        <input type="number" step="0.1" min="0" id="erderTiefe" placeholder="z. B. 1.5">
      </div>
      <div class="form-group">
        <label for="erderOrt">Ort des Tiefenerders:</label>
        <input type="text" id="erderOrt" placeholder="z. B. Garten hinter dem Haus, neben HAK">
      </div>
      <label class="custom-photo-btn">
        📷 Fotos: Erder & Messwerte (<span id="count_derder">0</span>)
        <input type="file" accept="image/*" capture="environment" onchange="handlePhoto(event, 'previewErder', 'derder', 'count_derder')">
      </label>
      <div id="previewErder" class="photo-preview"></div>
    </fieldset>

    <!-- 3. Potenzialausgleich -->
    <fieldset>
      <legend>Potenzialausgleich</legend>
      <div class="form-group">
        <label>Was wurde geerdet?</label>
        <div class="checkbox-list">
          <label class="checkbox-item"><input type="checkbox" name="pa_ziel" value="Zählerschrank"> Zählerschrank</label>
          <label class="checkbox-item"><input type="checkbox" name="pa_ziel" value="Hausanschlusskasten"> Hausanschlusskasten</label>
          <label class="checkbox-item"><input type="checkbox" name="pa_ziel" value="Gas"> Gas</label>
          <label class="checkbox-item"><input type="checkbox" name="pa_ziel" value="Wasser"> Wasser</label>
          <label class="checkbox-item"><input type="checkbox" name="pa_ziel" value="Heizung"> Heizung</label>
          <label class="checkbox-item"><input type="checkbox" name="pa_ziel" value="Kabelrinne"> Kabelrinne</label>
          <label class="checkbox-item"><input type="checkbox" name="pa_ziel" value="Kabel TV"> Kabel TV</label>
          <label class="checkbox-item"><input type="checkbox" name="pa_ziel" value="Wechselrichter"> Wechselrichter</label>
        </div>
      </div>
      <div class="form-group" style="margin-top: 10px;">
        <label for="paDetails">Zusätzliche Details:</label>
        <textarea id="paDetails" rows="2" placeholder="Optionale Anmerkungen..."></textarea>
      </div>
      <label class="custom-photo-btn">
        📷 Fotos: Potenzialausgleich (<span id="count_dpa">0</span>)
        <input type="file" accept="image/*" capture="environment" onchange="handlePhoto(event, 'previewPA', 'dpa', 'count_dpa')">
      </label>
      <div id="previewPA" class="photo-preview"></div>
    </fieldset>

    <!-- 4. Anlagen-Fotos -->
    <fieldset>
      <legend>⚡ Anlagen-Fotos (Pflicht)</legend>
      
      <label class="custom-photo-btn">
        📸 Fotos: Zähleranlagen ( <span id="count_dzaehler">0</span> )
        <input type="file" accept="image/*" capture="environment" onchange="handlePhoto(event, 'previewZaehler', 'dzaehler', 'count_dzaehler')">
      </label>
      <div id="previewZaehler" class="photo-preview"></div>

      <label class="custom-photo-btn">
        📸 Fotos: Hausanschlusskasten (HAK) ( <span id="count_dhak">0</span> )
        <input type="file" accept="image/*" capture="environment" onchange="handlePhoto(event, 'previewHAK', 'dhak', 'count_dhak')">
      </label>
      <div id="previewHAK" class="photo-preview"></div>
    </fieldset>

    <!-- 5. Abschluss, Export & Aktion -->
    <fieldset>
      <legend>✅ Abschluss, Export & Aktion</legend>
      <div class="btn-group">
        <button type="button" onclick="showSummary()">📋 Zusammenfassung anzeigen</button>
        <button type="button" class="btn-success" onclick="generatePDF()">📄 PDF-Bericht erstellen & herunterladen</button>
        <button type="button" class="btn-secondary" onclick="downloadAllPhotos()">📷 Alle Fotos einzeln herunterladen</button>
        <button type="button" class="btn-danger" onclick="clearForm()">🗑️ Formular vollständig leeren (Reset)</button>
      </div>
    </fieldset>

  </form>
</div>

<script>
  document.getElementById('datum').valueAsDate = new Date();

  const photosData = {
    derder: [],
    dpa: [],
    dzaehler: [],
    dhak: []
  };

  function sanitizeFilename(str) {
    if (!str) return '';
    return str.replace(/[^a-zA-Z0-9äöüÄÖÜß\-_]/g, '_').replace(/_+/g, '_').substring(0, 30);
  }

  function handlePhoto(event, previewId, storageKey, countId) {
    const files = event.target.files;
    if (!files || files.length === 0) return;

    const strasseText = document.getElementById('strasse').value.trim();
    const stadtText = document.getElementById('stadt').value.trim();
    const adresseText = (strasseText && stadtText) ? `${strasseText}, ${stadtText}` : (strasseText || stadtText || 'Objekt');
    
    const auftragText = document.getElementById('auftragsnummer').value.trim();
    const datumStr = new Date().toLocaleDateString('de-DE');
    const watermarkText = auftragText
      ? `${adresseText} | ${datumStr} | Auftrag: ${auftragText}`
      : `${adresseText} | ${datumStr}`;

    for (let file of files) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');

          ctx.drawImage(img, 0, 0);

          const fontSize = Math.max(16, Math.floor(canvas.height / 35));
          ctx.font = `bold ${fontSize}px sans-serif`;
          const textWidth = ctx.measureText(watermarkText).width;
          const padding = 10;
          const rectHeight = fontSize + (padding * 2);

          ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
          ctx.fillRect(0, canvas.height - rectHeight, textWidth + (padding * 2), rectHeight);

          ctx.fillStyle = '#ffffff';
          ctx.fillText(watermarkText, padding, canvas.height - padding - 2);

          const processedDataUrl = canvas.toDataURL('image/jpeg', 0.85);

          photosData[storageKey].push({
            name: file.name,
            data: processedDataUrl,
            width: img.width,
            height: img.height
          });

          renderPreviews(storageKey, previewId, countId);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
    event.target.value = '';
  }

  function renderPreviews(storageKey, previewId, countId) {
    const container = document.getElementById(previewId);
    container.innerHTML = '';
    
    if (countId) {
      document.getElementById(countId).innerText = photosData[storageKey].length;
    }

    photosData[storageKey].forEach((photo, index) => {
      const thumb = document.createElement('div');
      thumb.className = 'photo-thumb';
      
      const img = document.createElement('img');
      img.src = photo.data;
      thumb.appendChild(img);

      const delBtn = document.createElement('button');
      delBtn.className = 'delete-photo';
      delBtn.innerHTML = '&times;';
      delBtn.onclick = function() {
        photosData[storageKey].splice(index, 1);
        renderPreviews(storageKey, previewId, countId);
      };
      thumb.appendChild(delBtn);

      container.appendChild(thumb);
    });
  }

  function showSummary() {
    const datum = document.getElementById('datum').value;
    const auftrag = document.getElementById('auftragsnummer').value.trim() || '-';
    const monteur = document.getElementById('monteur').value.trim() || '-';
    const strasse = document.getElementById('strasse').value.trim() || '-';
    const plz = document.getElementById('plz').value.trim() || '';
    const stadt = document.getElementById('stadt').value.trim() || '';
    const ohmWert = document.getElementById('ohmWert').value || 'Keine Angabe';
    const paDetails = document.getElementById('paDetails').value.trim() || 'Keine';
    const erderTiefe = document.getElementById('erderTiefe').value;
    const erderOrt = document.getElementById('erderOrt').value.trim() || 'Keine Angabe';

    const selectedPA = Array.from(document.querySelectorAll('input[name="pa_ziel"]:checked'))
                            .map(cb => cb.value);
    const paText = selectedPA.length > 0 ? selectedPA.join(', ') : 'Keine Auswahl';

    const totalPhotos = photosData.derder.length + photosData.dpa.length + photosData.dzaehler.length + photosData.dhak.length;

    const summaryText = 
      `--- PROTOKOLL-ZUSAMMENFASSUNG ---\n\n` +
      `STAMMDATEN:\n` +
      `• Datum: ${datum}\n` +
      `• Auftragsnummer: ${auftrag}\n` +
      `• Monteur: ${monteur}\n` +
      `• Adresse: ${strasse}, ${plz} ${stadt}\n\n` +
      `ERDERPRÜFUNG:\n` +
      `• Erdungswiderstand: ${ohmWert} Ohm\n` +
      `• Tiefe Tiefenerder: ${erderTiefe ? erderTiefe + ' m' : 'Keine Angabe'}\n` +
      `• Ort Tiefenerder: ${erderOrt}\n\n` +
      `POTENZIALAUSGLEICH:\n` +
      `• Geerdet: ${paText}\n` +
      `• Details: ${paDetails}\n\n` +
      `FOTOS ANGESAMMELT:\n` +
      `• Erder & Messwerte: ${photosData.derder.length}\n` +
      `• Potenzialausgleich: ${photosData.dpa.length}\n` +
      `• Zähleranlagen: ${photosData.dzaehler.length}\n` +
      `• Hausanschlusskasten (HAK): ${photosData.dhak.length}\n` +
      `• Gesamtanzahl Fotos: ${totalPhotos}`;

    alert(summaryText);
  }

  function downloadAllPhotos() {
    const strasseClean = sanitizeFilename(document.getElementById('strasse').value.trim());
    const stadtClean = sanitizeFilename(document.getElementById('stadt').value.trim());
    const objektClean = (strasseClean && stadtClean) ? `${strasseClean}_${stadtClean}` : (strasseClean || stadtClean || 'Objekt');
    const datumVal = document.getElementById('datum').value || 'Datum';

    const categories = [
      { key: 'derder', prefix: 'Erder' },
      { key: 'dpa', prefix: 'Potenzialausgleich' },
      { key: 'dzaehler', prefix: 'Zaehleranlage' },
      { key: 'dhak', prefix: 'HAK' }
    ];

    let count = 0;
    categories.forEach(cat => {
      photosData[cat.key].forEach((photo, index) => {
        count++;
        const a = document.createElement('a');
        a.href = photo.data;
        a.download = `Foto_${cat.prefix}_${objektClean}_${datumVal}_${index + 1}.jpg`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      });
    });

    if (count === 0) {
      alert('Keine Fotos vorhanden zum Herunterladen.');
    }
  }

  function clearForm() {
    if (confirm('Möchten Sie das Formular wirklich leeren?')) {
      document.getElementById('erdungsForm').reset();
      document.getElementById('datum').valueAsDate = new Date();
      Object.keys(photosData).forEach(key => photosData[key] = []);
      ['previewErder', 'previewPA', 'previewZaehler', 'previewHAK'].forEach(id => {
        document.getElementById(id).innerHTML = '';
      });
      ['count_derder', 'count_dpa', 'count_dzaehler', 'count_dhak'].forEach(id => {
        document.getElementById(id).innerText = '0';
      });
    }
  }

  // ===== PDF-ERZEUGUNG =====
  // Firmenlogo (aus der Original-Index uebernommen, JPEG 900x361)
  const LOGO_BASE64 = 'HIER_DIE_LOGO_ZEILE_AUS_DER_ORIGINAL_INDEX_EINFUEGEN';
  const LOGO_ASPECT = 361/900; // Hoehe/Breite Verhaeltnis

  function generatePDF() {
    if (!window.jspdf) {
      alert("jsPDF-Bibliothek lädt noch. Bitte kurz warten.");
      return;
    }

    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: 'a4' });
      const pageWidth = doc.internal.pageSize.getWidth();   // 210
      const marginX = 15;
      const contentW = pageWidth - marginX * 2;              // 180
      const maxY = 272;                                       // Fußzeile beginnt bei 278
      const startY = 18;
      let y = startY;

      const datum = document.getElementById('datum').value;
      const auftrag = document.getElementById('auftragsnummer').value.trim();
      const monteur = document.getElementById('monteur').value.trim();
      const strasse = document.getElementById('strasse').value.trim();
      const plz = document.getElementById('plz').value.trim();
      const stadt = document.getElementById('stadt').value.trim();
      const ohmWert = document.getElementById('ohmWert').value;
      const paDetails = document.getElementById('paDetails').value.trim();
      const erderTiefe = document.getElementById('erderTiefe').value;
      const erderOrt = document.getElementById('erderOrt').value.trim();
      const selectedPA = Array.from(document.querySelectorAll('input[name="pa_ziel"]:checked')).map(cb => cb.value);

      function ensureSpace(needed) {
        if (y + needed > maxY) {
          doc.addPage();
          y = startY;
        }
      }

      function addHeading(text) {
        ensureSpace(14);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(13);
        doc.setTextColor(15, 23, 42);
        doc.text(text, marginX, y);
        y += 2;
        doc.setDrawColor(226, 232, 240);
        doc.setLineWidth(0.3);
        doc.line(marginX, y, pageWidth - marginX, y);
        y += 7;
      }

      function addRow(label, value) {
        const v = (value && String(value).trim()) ? String(value).trim() : '-';
        const lines = doc.splitTextToSize(v, contentW - 58);
        ensureSpace(lines.length * 5.2 + 2);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(10.5);
        doc.setTextColor(71, 85, 105);
        doc.text(label, marginX, y);
        doc.setFont('helvetica', 'normal');
        doc.setTextColor(15, 23, 42);
        doc.text(lines, marginX + 58, y);
        y += lines.length * 5.2 + 2;
      }

      function addBullets(items) {
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(10.5);
        doc.setTextColor(15, 23, 42);
        (items.length ? items : ['Keine']).forEach(item => {
          const lines = doc.splitTextToSize(String(item), contentW - 8);
          ensureSpace(lines.length * 5.2 + 2);
          doc.text('-', marginX + 2, y);
          doc.text(lines, marginX + 7, y);
          y += lines.length * 5.2 + 2;
        });
      }

      // --- Logo oben rechts (Seitenverhältnis aus dem Bild selbst) ---
      const logoW = 42;
      let logoH = logoW * LOGO_ASPECT;
