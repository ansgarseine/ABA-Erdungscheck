<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Protokoll über Erstellung der Erdungsanlage</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --bg-color: #f8fafc;
    --card-bg: #ffffff;
    --text-color: #1e293b;
    --border-color: #cbd5e1;
    --danger: #ef4444;
    --success: #22c55e;
  }
  body {
    font-family: system-ui, -apple-system, sans-serif, Arial;
    background-color: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: 10px;
    line-height: 1.5;
  }
  .container {
    max-width: 600px;
    margin: 0 auto;
    background: var(--card-bg);
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
  }
  h1 {
    font-size: 1.3rem;
    text-align: center;
    color: var(--primary);
    margin-bottom: 20px;
  }
  fieldset {
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 15px;
    background: #fff;
  }
  legend {
    font-weight: bold;
    color: var(--primary);
    padding: 0 5px;
  }
  .form-group {
    margin-bottom: 12px;
  }
  .form-row {
    display: flex;
    gap: 10px;
  }
  .form-row .form-group {
    flex: 1;
  }
  label {
    display: block;
    font-weight: 600;
    font-size: 0.9rem;
    margin-bottom: 5px;
  }
  input[type="text"], input[type="date"], input[type="number"], select, textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    box-sizing: border-box;
    font-size: 1rem;
  }
  .checkbox-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 8px;
  }
  .checkbox-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: normal;
  }
  .checkbox-item input {
    width: 20px;
    height: 20px;
  }
  .custom-photo-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    background-color: #2c3e50;
    color: white;
    padding: 12px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 0.95rem;
    cursor: pointer;
    margin-top: 8px;
    text-align: center;
    box-sizing: border-box;
  }
  .custom-photo-btn input[type="file"] {
    display: none;
  }
  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 20px;
  }
  button {
    background-color: var(--primary);
    color: white;
    border: none;
    padding: 12px;
    border-radius: 6px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { opacity: 0.9; }
  button.btn-success { background-color: var(--success); }
  button.btn-secondary { background-color: #64748b; }
  button.btn-danger { background-color: var(--danger); }
  
  .photo-preview {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 10px;
    justify-content: center;
  }
  .photo-thumb {
    position: relative;
    width: 80px;
    height: 80px;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--border-color);
  }
  .photo-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .photo-thumb button.delete-photo {
    position: absolute;
    top: 2px;
    right: 2px;
    background: rgba(239, 68, 68, 0.85);
    color: white;
    border: none;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Protokoll über Erstellung der Erdungsanlage</h1>
  
  <form id="erdungsForm">
    
    <!-- 1. Stammdaten -->
    <fieldset>
      <legend>📋 Stammdaten</legend>
      <div class="form-group">
        <label for="datum">Datum</label>
        <input type="date" id="datum" required>
      </div>
      <div class="form-group">
        <label for="auftragsnummer">Auftragsnummer</label>
        <input type="text" id="auftragsnummer" placeholder="z.B. 2026-991">
      </div>
      <div class="form-group">
        <label for="monteur">Monteur</label>
        <input type="text" id="monteur" required placeholder="Name">
      </div>
      <div class="form-group">
        <label for="strasse">Straße & Hausnummer</label>
        <input type="text" id="strasse" required placeholder="Musterstraße 12">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="plz">PLZ</label>
          <input type="text" id="plz" required placeholder="69115">
        </div>
        <div class="form-group">
          <label for="stadt">Stadt</label>
          <input type="text" id="stadt" required placeholder="Heidelberg">
        </div>
      </div>
    </fieldset>

    <!-- 2. Erderprüfung -->
    <fieldset>
      <legend>Erderprüfung</legend>
      <div class="form-group">
        <label for="erderVorhanden">Ist bereits ein Erder vorhanden?</label>
        <select id="erderVorhanden" onchange="updateErderFelder()">
          <option value="">Bitte wählen ...</option>
          <option value="ja">Ja, Erder ist vorhanden</option>
          <option value="nein">Nein, neuer Erder wurde gesetzt</option>
        </select>
      </div>
      <div id="erderNeuFelder" style="display:none;">
        <div class="form-group">
          <label for="ohmWert">Gemessener Erdungswiderstand (&Omega;):</label>
          <input type="number" step="0.01" id="ohmWert" placeholder="z. B. 0.5">
        </div>
        <div class="form-group">
          <label for="erderTiefe">Tiefe des Tiefenerders (m):</label>
          <input type="number" step="0.1" min="0" id="erderTiefe" placeholder="z. B. 1.5">
        </div>
      </div>
      <div class="form-group">
        <label for="erderOrt">Ort des Erders:</label>
        <input type="text" id="erderOrt" placeholder="z. B. Garten hinter dem Haus, neben HAK">
      </div>
      <label class="custom-photo-btn">
        📷 Fotos: Erder & Messwerte (<span id="count_derder">0</span>)
        <input type="file" accept="image/*" capture="environment" onchange="handlePhoto(event, 'previewErder', 'derder', 'count_derder')">
      </label>
      <div id="previewErder" class="photo-preview"></div>
    </fieldset>

    <!-- 3. Potenzialausgleich -->
    <fieldset>
      <legend>Potenzialausgleich</legend>
      <div class="form-group">
        <label>Was wurde geerdet?</label>
        <div class="checkbox-list">
          <label class="checkbox-item"><input type="checkbox" name="pa_ziel" value="Zählerschrank"> Zählerschrank</label>
          <label class="checkbox-item"><input type="checkbox" name="pa_ziel" value="Hausanschlusskasten"> Hausanschlusskasten</label>
          <label class="checkbox-item"><input type="checkbox" name="pa_ziel" value="Gas"> Gas</label>
          <label class="checkbox-item"><input type="checkbox" name="pa_ziel" value="Wasser"> Wasser</label>
          <label class="checkbox-item"><input type="checkbox" name="pa_ziel" value="Heizung"> Heizung</label>
          <label class="checkbox-item"><input type="checkbox" name="pa_ziel" value="Kabelrinne"> Kabelrinne</label>
          <label class="checkbox-item"><input type="checkbox" name="pa_ziel" value="Kabel TV"> Kabel TV</label>
          <label class="checkbox-item"><input type="checkbox" name="pa_ziel" value="Wechselrichter"> Wechselrichter</label>
        </div>
      </div>
      <div class="form-group" style="margin-top: 10px;">
        <label for="paDetails">Zusätzliche Details:</label>
        <textarea id="paDetails" rows="2" placeholder="Optionale Anmerkungen..."></textarea>
      </div>
      <label class="custom-photo-btn">
        📷 Fotos: Potenzialausgleich (<span id="count_dpa">0</span>)
        <input type="file" accept="image/*" capture="environment" onchange="handlePhoto(event, 'previewPA', 'dpa', 'count_dpa')">
      </label>
      <div id="previewPA" class="photo-preview"></div>
    </fieldset>

    <!-- 4. Anlagen-Fotos -->
    <fieldset>
      <legend>⚡ Anlagen-Fotos (Pflicht)</legend>
      
      <label class="custom-photo-btn">
        📸 Fotos: Zähleranlagen ( <span id="count_dzaehler">0</span> )
        <input type="file" accept="image/*" capture="environment" onchange="handlePhoto(event, 'previewZaehler', 'dzaehler', 'count_dzaehler')">
      </label>
      <div id="previewZaehler" class="photo-preview"></div>

      <label class="custom-photo-btn">
        📸 Fotos: Hausanschlusskasten (HAK) ( <span id="count_dhak">0</span> )
        <input type="file" accept="image/*" capture="environment" onchange="handlePhoto(event, 'previewHAK', 'dhak', 'count_dhak')">
      </label>
      <div id="previewHAK" class="photo-preview"></div>
    </fieldset>

    <!-- 5. Abschluss, Export & Aktion -->
    <fieldset>
      <legend>✅ Abschluss, Export & Aktion</legend>
      <div class="btn-group">
        <button type="button" onclick="showSummary()">📋 Zusammenfassung anzeigen</button>
        <button type="button" class="btn-success" onclick="generatePDF()">📄 PDF-Bericht erstellen & herunterladen</button>
        <button type="button" class="btn-secondary" onclick="downloadPhotosZip()">📦 Alle Fotos als ZIP herunterladen</button>
        <button type="button" class="btn-secondary" onclick="downloadAllPhotos()">📷 Alle Fotos einzeln herunterladen</button>
        <button type="button" class="btn-danger" onclick="clearForm()">🗑️ Formular vollständig leeren (Reset)</button>
      </div>
    </fieldset>

  </form>
</div>

<script>
  document.getElementById('datum').valueAsDate = new Date();

  const photosData = {
    derder: [],
    dpa: [],
    dzaehler: [],
    dhak: []
  };

  // Erder vorhanden? Ja -> Widerstand/Tiefe ausblenden. Nein (neu gesetzt) -> einblenden.
  function updateErderFelder() {
    const neu = document.getElementById('erderVorhanden').value === 'nein';
    document.getElementById('erderNeuFelder').style.display = neu ? 'block' : 'none';
  }

  // ===== Eigene Meldungsfenster (alert()/confirm() werden in eingebetteten Seiten oft stumm blockiert) =====
  function showDialog(text, withCancel) {
    return new Promise(resolve => {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,0.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:99999;';
      const box = document.createElement('div');
      box.style.cssText = 'background:#fff;color:#1e293b;border-radius:12px;max-width:480px;width:100%;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,0.35);';
      const msg = document.createElement('div');
      msg.style.cssText = 'padding:18px;overflow:auto;white-space:pre-wrap;font-size:0.95rem;line-height:1.45;';
      msg.textContent = text;
      const bar = document.createElement('div');
      bar.style.cssText = 'display:flex;gap:10px;padding:0 18px 18px;';
      function close(result) { document.body.removeChild(overlay); resolve(result); }
      if (withCancel) {
        const no = document.createElement('button');
        no.type = 'button';
        no.className = 'btn-secondary';
        no.style.flex = '1';
        no.textContent = 'Abbrechen';
        no.onclick = () => close(false);
        bar.appendChild(no);
      }
      const ok = document.createElement('button');
      ok.type = 'button';
      ok.style.flex = '1';
      ok.textContent = 'OK';
      ok.onclick = () => close(true);
      bar.appendChild(ok);
      box.appendChild(msg);
      box.appendChild(bar);
      overlay.appendChild(box);
      document.body.appendChild(overlay);
    });
  }
  function showMessage(text) { return showDialog(text, false); }
  function showConfirm(text) { return showDialog(text, true); }

  // Unerwartete Fehler sichtbar machen statt stumm zu scheitern
  window.addEventListener('error', function(e) {
    showMessage('Unerwarteter Fehler: ' + (e.message || 'unbekannt'));
  });
  window.addEventListener('unhandledrejection', function(e) {
    showMessage('Unerwarteter Fehler: ' + ((e.reason && e.reason.message) || e.reason || 'unbekannt'));
  });

  // Datei speichern: im veröffentlichten Artifact über die "downloads"-Funktion,
  // sonst (normale HTML-Datei) über einen klassischen Download-Link.
  async function saveFile(filename, blob) {
    let dl = null;
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        dl = await window.claude.use('downloads');
      }
    } catch (e) { dl = null; }

    if (dl) {
      try {
        await dl.save({ filename: filename, data: blob });
      } catch (err) {
        if (!err || err.code !== 'declined') {
          console.error('Speichern fehlgeschlagen:', filename, err);
          showMessage('Die Datei konnte nicht gespeichert werden: ' + ((err && err.message) || 'Unbekannter Fehler'));
        }
      }
      return;
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  }

  function sanitizeFilename(str) {
    if (!str) return '';
    return str.replace(/[^a-zA-Z0-9äöüÄÖÜß\-_]/g, '_').replace(/_+/g, '_').substring(0, 30);
  }

  function handlePhoto(event, previewId, storageKey, countId) {
    // Dateiliste sofort sichern (die Liste des Eingabefelds wird beim Zurücksetzen geleert)
    const files = Array.from(event.target.files || []);
    event.target.value = '';
    if (files.length === 0) return;

    const strasseText = document.getElementById('strasse').value.trim();
    const stadtText = document.getElementById('stadt').value.trim();
    const adresseText = (strasseText && stadtText) ? `${strasseText}, ${stadtText}` : (strasseText || stadtText || 'Objekt');

    const auftragText = document.getElementById('auftragsnummer').value.trim();
    const datumStr = new Date().toLocaleDateString('de-DE');
    const watermarkText = auftragText
      ? `${adresseText} | ${datumStr} | Auftrag: ${auftragText}`
      : `${adresseText} | ${datumStr}`;

    files.forEach(file => processPhoto(file, watermarkText, previewId, storageKey, countId));
  }

  function processPhoto(file, watermarkText, previewId, storageKey, countId) {
    const reader = new FileReader();
    reader.onerror = function() {
      showMessage('Das Foto konnte nicht gelesen werden. Bitte erneut aufnehmen.');
    };
    reader.onload = function(e) {
      const img = new Image();
      img.onerror = function() {
        showMessage('Das Foto konnte nicht verarbeitet werden. Bitte erneut aufnehmen.');
      };
      img.onload = function() {
        try {
          // Sehr große Handyfotos (z. B. 50 MP) auf max. 2560 px Kantenlänge verkleinern (spart Speicher)
          const maxSide = 2560;
          const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
          const w = Math.round(img.naturalWidth * scale);
          const h = Math.round(img.naturalHeight * scale);

          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);

          const fontSize = Math.max(16, Math.floor(h / 35));
          ctx.font = `bold ${fontSize}px sans-serif`;
          const textWidth = ctx.measureText(watermarkText).width;
          const padding = 10;
          const rectHeight = fontSize + (padding * 2);

          ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
          ctx.fillRect(0, h - rectHeight, textWidth + (padding * 2), rectHeight);

          ctx.fillStyle = '#ffffff';
          ctx.fillText(watermarkText, padding, h - padding - 2);

          const processedDataUrl = canvas.toDataURL('image/jpeg', 0.85);

          photosData[storageKey].push({
            name: file.name,
            data: processedDataUrl,
            width: w,
            height: h
          });

          renderPreviews(storageKey, previewId, countId);
        } catch (err) {
          showMessage('Fehler bei der Foto-Verarbeitung: ' + err.message);
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function renderPreviews(storageKey, previewId, countId) {
    const container = document.getElementById(previewId);
    container.innerHTML = '';
    
    if (countId) {
      document.getElementById(countId).innerText = photosData[storageKey].length;
    }

    photosData[storageKey].forEach((photo, index) => {
      const thumb = document.createElement('div');
      thumb.className = 'photo-thumb';
      
      const img = document.createElement('img');
      img.src = photo.data;
      thumb.appendChild(img);

      const delBtn = document.createElement('button');
      delBtn.className = 'delete-photo';
      delBtn.innerHTML = '&times;';
      delBtn.onclick = function() {
        photosData[storageKey].splice(index, 1);
        renderPreviews(storageKey, previewId, countId);
      };
      thumb.appendChild(delBtn);

      container.appendChild(thumb);
    });
  }

  function showSummary() {
    const datum = document.getElementById('datum').value;
    const auftrag = document.getElementById('auftragsnummer').value.trim() || '-';
    const monteur = document.getElementById('monteur').value.trim() || '-';
    const strasse = document.getElementById('strasse').value.trim() || '-';
    const plz = document.getElementById('plz').value.trim() || '';
    const stadt = document.getElementById('stadt').value.trim() || '';
    const erderVorhanden = document.getElementById('erderVorhanden').value;
    const erderNeu = erderVorhanden === 'nein';
    const ohmWert = document.getElementById('ohmWert').value || 'Keine Angabe';
    const paDetails = document.getElementById('paDetails').value.trim() || 'Keine';
    const erderTiefe = document.getElementById('erderTiefe').value;
    const erderOrt = document.getElementById('erderOrt').value.trim() || 'Keine Angabe';
    const erderStatusText = erderVorhanden === 'ja' ? 'Ja (bestehender Erder)' : (erderNeu ? 'Nein (neuer Erder gesetzt)' : 'Keine Auswahl');

    const selectedPA = Array.from(document.querySelectorAll('input[name="pa_ziel"]:checked'))
                            .map(cb => cb.value);
    const paText = selectedPA.length > 0 ? selectedPA.join(', ') : 'Keine Auswahl';

    const totalPhotos = photosData.derder.length + photosData.dpa.length + photosData.dzaehler.length + photosData.dhak.length;

    const summaryText = 
      `--- PROTOKOLL-ZUSAMMENFASSUNG ---\n\n` +
      `STAMMDATEN:\n` +
      `• Datum: ${datum}\n` +
      `• Auftragsnummer: ${auftrag}\n` +
      `• Monteur: ${monteur}\n` +
      `• Adresse: ${strasse}, ${plz} ${stadt}\n\n` +
      `ERDERPRÜFUNG:\n` +
      `• Erder vorhanden: ${erderStatusText}\n` +
      (erderNeu ? `• Erdungswiderstand: ${ohmWert} Ohm\n` +
                  `• Tiefe Tiefenerder: ${erderTiefe ? erderTiefe + ' m' : 'Keine Angabe'}\n` : '') +
      `• Ort des Erders: ${erderOrt}\n\n` +
      `POTENZIALAUSGLEICH:\n` +
      `• Geerdet: ${paText}\n` +
      `• Details: ${paDetails}\n\n` +
      `FOTOS ANGESAMMELT:\n` +
      `• Erder & Messwerte: ${photosData.derder.length}\n` +
      `• Potenzialausgleich: ${photosData.dpa.length}\n` +
      `• Zähleranlagen: ${photosData.dzaehler.length}\n` +
      `• Hausanschlusskasten (HAK): ${photosData.dhak.length}\n` +
      `• Gesamtanzahl Fotos: ${totalPhotos}`;

    showMessage(summaryText);
  }

  // Alle Fotos in EINER ZIP-Datei: ein einziger Download, wird von keinem Browser blockiert
  async function downloadPhotosZip() {
    if (!window.JSZip) {
      showMessage('ZIP-Bibliothek lädt noch bzw. ist offline nicht verfügbar. Bitte kurz warten oder "Alle Fotos einzeln herunterladen" verwenden.');
      return;
    }

    const strasseClean = sanitizeFilename(document.getElementById('strasse').value.trim());
    const stadtClean = sanitizeFilename(document.getElementById('stadt').value.trim());
    const objektClean = (strasseClean && stadtClean) ? `${strasseClean}_${stadtClean}` : (strasseClean || stadtClean || 'Objekt');
    const datumVal = document.getElementById('datum').value || 'Datum';

    const categories = [
      { key: 'derder', prefix: 'Erder' },
      { key: 'dpa', prefix: 'Potenzialausgleich' },
      { key: 'dzaehler', prefix: 'Zaehleranlage' },
      { key: 'dhak', prefix: 'HAK' }
    ];

    const zip = new JSZip();
    let count = 0;
    categories.forEach(cat => {
      photosData[cat.key].forEach((photo, index) => {
        const base64 = photo.data.split(',')[1];
        zip.file(`Foto_${cat.prefix}_${objektClean}_${datumVal}_${index + 1}.jpg`, base64, { base64: true });
        count++;
      });
    });

    if (count === 0) {
      showMessage('Keine Fotos vorhanden zum Herunterladen.');
      return;
    }

    try {
      const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
      await saveFile(`Fotos_${objektClean}_${datumVal}.zip`, blob);
    } catch (err) {
      console.error('ZIP-Erstellung fehlgeschlagen:', err);
      showMessage('Fehler bei der ZIP-Erstellung: ' + err.message);
    }
  }

  async function downloadAllPhotos() {
    const strasseClean = sanitizeFilename(document.getElementById('strasse').value.trim());
    const stadtClean = sanitizeFilename(document.getElementById('stadt').value.trim());
    const objektClean = (strasseClean && stadtClean) ? `${strasseClean}_${stadtClean}` : (strasseClean || stadtClean || 'Objekt');
    const datumVal = document.getElementById('datum').value || 'Datum';

    const categories = [
      { key: 'derder', prefix: 'Erder' },
      { key: 'dpa', prefix: 'Potenzialausgleich' },
      { key: 'dzaehler', prefix: 'Zaehleranlage' },
      { key: 'dhak', prefix: 'HAK' }
    ];

    // Alle Fotos in eine Liste
    const queue = [];
    categories.forEach(cat => {
      photosData[cat.key].forEach((photo, index) => {
        queue.push({
          data: photo.data,
          filename: `Foto_${cat.prefix}_${objektClean}_${datumVal}_${index + 1}.jpg`
        });
      });
    });

    if (queue.length === 0) {
      showMessage('Keine Fotos vorhanden zum Herunterladen.');
      return;
    }

    // Einige Android-Browser (z. B. Samsung) blockieren mehrere Downloads, die gleichzeitig
    // starten. Daher: nacheinander, mit Pause, als Blob statt als riesige data-URL.
    for (let i = 0; i < queue.length; i++) {
      const item = queue[i];
      try {
        const blob = await (await fetch(item.data)).blob();
        await saveFile(item.filename, blob);
      } catch (err) {
        console.error('Foto-Download fehlgeschlagen:', item.filename, err);
      }
      if (i < queue.length - 1) {
        await new Promise(resolve => setTimeout(resolve, 900));
      }
    }
  }

  async function clearForm() {
    if (await showConfirm('Möchten Sie das Formular wirklich leeren?')) {
      document.getElementById('erdungsForm').reset();
      document.getElementById('datum').valueAsDate = new Date();
      updateErderFelder();
      Object.keys(photosData).forEach(key => photosData[key] = []);
      ['previewErder', 'previewPA', 'previewZaehler', 'previewHAK'].forEach(id => {
        document.getElementById(id).innerHTML = '';
      });
      ['count_derder', 'count_dpa', 'count_dzaehler', 'count_dhak'].forEach(id => {
        document.getElementById(id).innerText = '0';
      });
    }
  }

      const erderVorhanden = document.getElementById('erderVorhanden').value;
      const erderNeu = erderVorhanden === 'nein';
      const ohmWert = document.getElementById('ohmWert').value;
      const paDetails = document.getElementById('paDetails').value.trim();
      const erderTiefe = document.getElementById('erderTiefe').value;
      const erderOrt = document.getElementById('erderOrt').value.trim();
      const selectedPA = Array.from(document.querySelectorAll('input[name="pa_ziel"]:checked')).map(cb => cb.value);

      function ensureSpace(needed) {
        if (y + needed > maxY) {
          doc.addPage();
          y = startY;
        }
      }

      function addHeading(text) {
        ensureSpace(14);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(13);
        doc.setTextColor(15, 23, 42);
        doc.text(text, marginX, y);
        y += 2;
        doc.setDrawColor(226, 232, 240);
        doc.setLineWidth(0.3);
        doc.line(marginX, y, pageWidth - marginX, y);
        y += 7;
      }

      function addRow(label, value) {
        const v = (value && String(value).trim()) ? String(value).trim() : '-';
        const lines = doc.splitTextToSize(v, contentW - 58);
        ensureSpace(lines.length * 5.2 + 2);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(10.5);
        doc.setTextColor(71, 85, 105);
        doc.text(label, marginX, y);
        doc.setFont('helvetica', 'normal');
        doc.setTextColor(15, 23, 42);
        doc.text(lines, marginX + 58, y);
        y += lines.length * 5.2 + 2;
      }

      function addBullets(items) {
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(10.5);
        doc.setTextColor(15, 23, 42);
        (items.length ? items : ['Keine']).forEach(item => {
          const lines = doc.splitTextToSize(String(item), contentW - 8);
          ensureSpace(lines.length * 5.2 + 2);
          doc.text('-', marginX + 2, y);
          doc.text(lines, marginX + 7, y);
          y += lines.length * 5.2 + 2;
        });
      }

      // --- Logo oben rechts (Seitenverhältnis aus dem Bild selbst) ---
      const logoW = 42;
      let logoH = logoW * LOGO_ASPECT;
      try {
        const lp = doc.getImageProperties(LOGO_BASE64);
        logoH = logoW * (lp.height / lp.width);
      } catch (e) {}
      try {
        doc.addImage(LOGO_BASE64, 'JPEG', pageWidth - marginX - logoW, 10, logoW, logoH);
      } catch (e) {
        console.error('Logo konnte nicht eingebettet werden:', e);
      }

      // --- Titel (Linie endet vor dem Logo) ---
      const title = 'Protokoll über Erstellung der Erdungsanlage';
      const titleMaxW = contentW - logoW - 5;
      doc.setFont('helvetica', 'bold');
      let tSize = 17;
      doc.setFontSize(tSize);
      while (doc.getTextWidth(title) > titleMaxW && tSize > 10) {
        tSize -= 0.5;
        doc.setFontSize(tSize);
      }
      doc.setTextColor(26, 86, 219);
      doc.text(title, marginX, y + 6);
      y += 9;
      doc.setDrawColor(26, 86, 219);
      doc.setLineWidth(0.7);
      doc.line(marginX, y, marginX + titleMaxW, y);
      y = Math.max(y + 8, 10 + logoH + 8);

      // --- Stammdaten ---
      addHeading('Stammdaten');
      addRow('Datum:', datum);
      addRow('Auftragsnummer:', auftrag);
      addRow('Monteur:', monteur);
      addRow('Adresse / Objekt:', `${strasse || '-'}, ${plz} ${stadt}`.trim());
      y += 4;

      // --- Erderprüfung ---
      addHeading('Erderprüfung');
      addRow('Erder vorhanden:', erderVorhanden === 'ja' ? 'Ja (bestehender Erder)' : (erderNeu ? 'Nein (neuer Erder gesetzt)' : '-'));
      if (erderNeu) {
        addRow('Erdungswiderstand:', ohmWert ? ohmWert + ' Ohm' : 'N/A');
        addRow('Tiefe Tiefenerder:', erderTiefe ? erderTiefe + ' m' : '-');
      }
      addRow('Ort des Erders:', erderOrt);
      y += 4;

      // --- Potenzialausgleich ---
      addHeading('Potenzialausgleich (Was wurde geerdet?)');
      addBullets(selectedPA);
      if (paDetails) {
        y += 1;
        addRow('Details:', paDetails);
      }
      y += 4;

      // --- Fotos: Seitenverhältnis immer aus dem eingebetteten JPEG, 2 pro Reihe ---
      const boxW = 86, boxH = 64, gap = 8;

      function fitPhoto(photo) {
        const p = doc.getImageProperties(photo.data);
        const ratio = p.height / p.width;
        let w = boxW, h = w * ratio;
        if (h > boxH) { h = boxH; w = h / ratio; }
        return { w, h };
      }

      function addPhotosToPdf(titleText, photos) {
        if (!photos || photos.length === 0) return;
        const sizes = photos.map(fitPhoto);

        // Überschrift nie allein am Seitenende: Platz für Überschrift + erste Reihe prüfen
        const firstRowH = Math.max(sizes[0].h, sizes[1] ? sizes[1].h : 0);
        ensureSpace(14 + firstRowH);
        addHeading(titleText);

        for (let i = 0; i < photos.length; i += 2) {
          const rowH = Math.max(sizes[i].h, sizes[i + 1] ? sizes[i + 1].h : 0);
          ensureSpace(rowH + 2);
          for (let c = 0; c < 2 && i + c < photos.length; c++) {
            const s = sizes[i + c];
            const x = marginX + c * (boxW + gap);
            try {
              doc.addImage(photos[i + c].data, 'JPEG', x, y, s.w, s.h);
            } catch (e) {
              console.error('Fehler beim Einbetten des Fotos:', e);
            }
          }
          y += rowH + 6;
        }
        y += 2;
      }

      addPhotosToPdf('Fotos: Erder & Messwerte', photosData.derder);
      addPhotosToPdf('Fotos: Potenzialausgleich', photosData.dpa);
      addPhotosToPdf('Fotos: Zähleranlagen', photosData.dzaehler);
      addPhotosToPdf('Fotos: Hausanschlusskasten (HAK)', photosData.dhak);

      // --- Fußzeile auf allen Seiten ---
      const pageCount = doc.internal.getNumberOfPages();
      const pageHeight = doc.internal.pageSize.getHeight();
      for (let i = 1; i <= pageCount; i++) {
        doc.setPage(i);
        doc.setDrawColor(200, 200, 200);
        doc.setLineWidth(0.3);
        doc.line(marginX, 278, pageWidth - marginX, 278);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(8);
        doc.setTextColor(148, 163, 184);
        doc.text('Erstellt durch ABA Erdungscheck-System', marginX, pageHeight - 14);
        doc.text(`Seite ${i} von ${pageCount}`, pageWidth - marginX, pageHeight - 14, { align: 'right' });
        doc.setTextColor(100, 116, 139);
        doc.text('Elektro Fachbetrieb Jordine | GBP | GmbH  -  Fred-Joachim-Schoeps-Straße 3, 68229 Mannheim', marginX, pageHeight - 9);
      }

      const strasseClean = sanitizeFilename(strasse);
      const stadtClean = sanitizeFilename(stadt);
      const objekt = (strasseClean && stadtClean) ? `${strasseClean}_${stadtClean}` : (strasseClean || stadtClean || 'Objekt');
      saveFile(`Erdungsprotokoll_${objekt}_${datum || 'Datum'}.pdf`, doc.output('blob'));
    } catch (err) {
      console.error('PDF-Erstellung fehlgeschlagen:', err);
      showMessage('Fehler bei der PDF-Erstellung: ' + err.message);
    }
  }
</script>
</body>
</html>
